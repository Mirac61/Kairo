# release-please öffnet nach jedem Push auf main einen Release-PR (Version + CHANGELOG.md).
# Wird der PR gemergt, legt es Tag und Release an; danach baut goreleaser die Dateien.
# Ein von Hand gepushter Tag (git tag v0.2.0 && git push --tags) löst weiterhin nur goreleaser aus.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Der Tag entsteht mit dem GITHUB_TOKEN und löst deshalb keinen eigenen Workflow-Lauf aus;
      # goreleaser läuft gleich hier, sobald release-please ein Release angelegt hat.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # goreleaser behängt seine Dateien an das vorhandene Release und lässt die Notizen von
      # release-please stehen (Standard: release.mode keep-existing).
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
